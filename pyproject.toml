[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-task-planning-agent"
version = "0.1.0"
description = "A staged implementation of a content task planning agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3.0",
]

[project.scripts]
content-agent = "content_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
